version: '3.8'

services:
  # Base de données PostgreSQL (réutilisation du volume existant)
  postgres-sync:
    image: postgres:15
    container_name: postgres-sync
    ports:
      - "5432:5432"
    volumes:
      - technidalle_project_postgres_sync_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technidalle-network


  mcp-postgres-server:
    build:
      context: ./mcp-postgres-server
      dockerfile: Dockerfile
    container_name: mcp-postgres-server
    ports:
      - "3333:3000"
    environment:
      # Configuration pour postgres_sync
      - POSTGRES_SYNC_HOST=postgres
      - POSTGRES_SYNC_PORT=5432
      - POSTGRES_SYNC_USER=postgres
      - POSTGRES_SYNC_PASSWORD=postgres
      - POSTGRES_SYNC_DATABASE=postgres
      # Configuration serveur HTTP
      - HTTP_PORT=3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      postgres_sync:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NATS Message Broker
  nats:
    image: nats:latest
    container_name: technidalle-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "nats", "server", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - technidalle-network

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: technidalle-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - technidalle-network

  # API Gateway - Port 3000
  api-gateway:
    build: ./api-gateway
    container_name: technidalle-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres-sync:5432/postgres
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=technidalle-jwt-secret-2024
      - NODE_ENV=development
    depends_on:
      postgres-sync:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - technidalle-network

  # Auth Service - Port 3001
  auth-service:
    build: ./auth-service
    container_name: technidalle-auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres-sync:5432/postgres
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=technidalle-jwt-secret-2024
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=development
    depends_on:
      postgres-sync:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
