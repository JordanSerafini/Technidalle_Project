        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "queryId": "projects_by_date",
              "queryDetails": {
                "keywords": [
                  "projet",
                  "chantier",
                  "date",
                  "période",
                  "entre",
                  "du",
                  "au",
                  "janvier",
                  "février",
                  "mars",
                  "avril",
                  "mai",
                  "juin",
                  "juillet",
                  "août",
                  "septembre",
                  "octobre",
                  "novembre",
                  "décembre",
                  "année",
                  "mois",
                  "jour"
                ],
                "questions": [
                  "Quels sont les chantiers de [DATE] ?",
                  "Projets du [DATE]",
                  "Chantiers en [DATE]",
                  "Liste des projets de [DATE]",
                  "Quels chantiers sont prévus [DATE] ?",
                  "Projets planifiés [DATE]",
                  "Quels sont les chantiers entre [DATE_DEBUT] et [DATE_FIN] ?",
                  "Projets du [DATE_DEBUT] au [DATE_FIN]",
                  "Chantiers sur la période [DATE_DEBUT] - [DATE_FIN]"
                ],
                "prisma": "async (params) => { const { startDate, endDate } = params; return await prisma.projects.findMany({ where: { OR: [{ start_date: { gte: startDate, lte: endDate } }, { end_date: { gte: startDate, lte: endDate } }, { AND: [{ start_date: { lte: endDate } }, { end_date: { gte: startDate } }] }] }, include: { clients: { select: { firstname: true, lastname: true, company_name: true } } }, project_stages: { select: { name: true, status: true, start_date: true, end_date: true, completion_percentage: true } } }, orderBy: { start_date: 'desc' } }); }",
                "response_format": "table",
                "description": "Liste des projets et chantiers sur une période donnée"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: User-Agent
            value: insomnia/11.1.0
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
