            {"id":1,"question":"Quelle est la durée moyenne d'un chantier de rénovation de salle de bain?","answer":"Pour une salle de bain standard (environ 6-8m²), notre équipe réalise généralement les travaux en 5 à 7 jours ouvrés, incluant la dépose de l'ancien carrelage, la préparation des supports, la pose du nouveau carrelage sol et murs, et les finitions.","category":"délais","tags":["salle de bain","rénovation","durée"]}
            {"index":{"_index":"knowledge_base"}}
            {"id":2,"question":"Quelles sont les différences entre une chape traditionnelle et une chape fluide?","answer":"La chape traditionnelle est réalisée à base de mortier de ciment, appliquée et tirée manuellement. Elle nécessite un temps de séchage de 7-10 jours avant pose du carrelage. La chape fluide, généralement anhydrite, est coulée, autonivellante et permet une mise en œuvre plus rapide. Elle est idéale pour les planchers chauffants et offre une meilleure planéité, mais nécessite un séchage de 2-3 semaines.","category":"technique","tags":["chape","comparaison"]}
            {"index":{"_index":"knowledge_base"}}
            {"id":3,"question":"Proposez-vous des garanties sur vos travaux?","answer":"Oui, tous nos travaux de carrelage et chape sont garantis 10 ans dans le cadre de la garantie décennale. Nous fournissons également une garantie de parfait achèvement d'un an couvrant les éventuels défauts de finition.","category":"garanties","tags":["garantie","assurance"]} 
